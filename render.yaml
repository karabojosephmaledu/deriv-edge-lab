services:
  # FastAPI backend (Deriv config + OAuth token exchange)
  - type: web
    name: deriv-edge-lab-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/deriv/config
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: deriv_edge_lab
      - key: CORS_ORIGINS
        sync: false
      - key: DERIV_APP_ID
        sync: false

  # Static frontend (plain HTML/CSS/JS). /api/* is proxied to the backend so
  # the OAuth redirect <site>/api/deriv/callback works on the same origin.
  - type: web
    name: deriv-edge-lab-web
    runtime: static
    buildCommand: mkdir -p site && cp frontend/index.html site/ && cp -r frontend/public/. site/
    staticPublishPath: site
    routes:
      - type: rewrite
        source: /api/*
        destination: https://deriv-edge-lab-api.onrender.com/api/*
